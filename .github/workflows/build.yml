name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android folder
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --org com.asifawan1120 --project-name loadtaxpk --platforms android .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Mobile Load Calculator PK"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: load-tax-pk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
